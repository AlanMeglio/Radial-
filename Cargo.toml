[package]
name = "radial"
version = "0.1.0"
edition = "2021"
description = "Drag a file, hold Shift, drop on a radial menu to convert it."
license = "MIT"
rust-version = "1.75"

[dependencies]
ab_glyph = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3 # measured: 1.9 MB vs 1.45 MB for "z", but conversions run 1.3-2.6x faster (3000x2000 PNG: JPG 188 vs 312 ms, WebP 68 vs 179 ms)
lto = true
codegen-units = 1
panic = "abort"
strip = true
