[package]
name = "radial"
version = "0.1.0"
edition = "2021"
description = "Drag a file, hold Shift, drop on a radial menu to convert it."
license = "MIT"
rust-version = "1.75"

[features]
# Pure-Rust AVIF encoder (rav1e): adds about 2.3 MB. Without it AVIF output needs an AV1 encoder in Windows,
# which Windows does not ship, so the AVIF sector stays disabled with an explanation.
avif-encode = ["image/avif"]

[dependencies]
ab_glyph = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# Deflate for PDF streams and DOCX (zip) with the pure-Rust backend only.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1", default-features = false, features = ["std"] }
# Same version `image` already links; used directly for palette-optimised PNG output.
png = { version = "0.18", default-features = false }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# PDF rendering and HEIC/AVIF go through the OS (Windows.Data.Pdf, WIC): no codec DLL is shipped.
[dependencies.windows]
version = "0.62"
default-features = false
features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "UI",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
]

[profile.release]
opt-level = 3 # measured: 1.9 MB vs 1.45 MB for "z", but conversions run 1.3-2.6x faster (3000x2000 PNG: JPG 188 vs 312 ms, WebP 68 vs 179 ms)
lto = true
codegen-units = 1
panic = "abort"
strip = true
